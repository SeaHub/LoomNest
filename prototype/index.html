<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ececea">
    <meta name="description" content="LoomNest 的数字作品档案：网站、小程序、移动应用，以及仍在生长中的下一件作品。">
    <title>LoomNest — Selected Works</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { loadWorks, mountPortfolio } from './app.js';

      const root = document.querySelector('#app');
      const fallbackWorks = [
        { id: 'fallback-web', title: 'Atlas 文化地图', titleEn: 'Atlas Culture Map', type: 'web', year: 2026, summary: '把城市文化、展览与公共空间整理成一张可探索的地图。', image: './assets/atlas-web.png', role: ['信息架构', '交互设计'], access: { url: 'https://example.com/atlas-culture' }, status: 'live' },
        { id: 'fallback-mini', title: '织境小屋', titleEn: 'Weave House', type: 'mini-program', year: 2025, summary: '一款收集灵感、整理日常小物与城市去处的小程序。', image: './assets/weave-mini.png', role: ['产品设计'], access: { qrImage: './assets/weave-mini-qr.png', qrAlt: '织境小屋小程序二维码' }, status: 'live' },
        { id: 'fallback-mobile', title: 'Flow 日记', titleEn: 'Flow Diary', type: 'mobile', year: 2026, summary: '专注与记录的日常伴侣。', image: './assets/flow-mobile.png', role: ['产品设计', '开发'], access: { appStore: 'https://apps.apple.com/', googlePlay: 'https://play.google.com/' }, status: 'live' },
      ];

      try {
        const works = await loadWorks();
        mountPortfolio(root, works);
      } catch (error) {
        mountPortfolio(root, fallbackWorks);
        const notice = document.createElement('p');
        notice.className = 'data-notice';
        notice.textContent = '暂时使用示例数据：请检查 works.json 的格式或路径。';
        notice.title = error.message;
        root.prepend(notice);
      }
    </script>
  </body>
</html>
